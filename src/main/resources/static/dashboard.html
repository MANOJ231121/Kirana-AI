<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirana Store - Shopkeeper Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 8px;
        }
        .status-connected {
            background: #4CAF50;
        }
        .status-disconnected {
            background: #f44336;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #764ba2;
        }
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .order-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.2s;
        }
        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .order-header {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-id {
            font-weight: bold;
            color: #764ba2;
        }
        .order-status {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-CREATED { background: #E3F2FD; color: #1976D2; }
        .status-PREPARING { background: #FFF3E0; color: #F57C00; }
        .status-CONFIRMED { background: #E8F5E9; color: #388E3C; }
        .status-COMPLETED { background: #C8E6C9; color: #2E7D32; }
        .status-CANCELLED { background: #FFEBEE; color: #C62828; }
        .order-body {
            padding: 15px;
        }
        .customer-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
        }
        .customer-info p {
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
        }
        .items-list {
            list-style: none;
        }
        .items-list li {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .items-list li:last-child {
            border-bottom: none;
        }
        .item-name {
            font-weight: 500;
        }
        .item-qty {
            color: #666;
        }
        .order-footer {
            padding: 12px 15px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #666;
        }
        .no-orders {
            text-align: center;
            color: #999;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .call-log {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-top: 20px;
            padding: 20px;
        }
        .call-log h2 {
            margin-bottom: 15px;
            color: #555;
        }
        .call-entry {
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .call-entry:last-child {
            border-bottom: none;
        }
        .call-time {
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏪 Kirana Store Dashboard</h1>
        <p>Real-time order tracking from AI phone assistant</p>
        <span id="ws-status" class="status-badge status-disconnected">Disconnected</span>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Orders</h3>
                <div id="total-orders" class="value">0</div>
            </div>
            <div class="stat-card">
                <h3>Preparing</h3>
                <div id="preparing-orders" class="value">0</div>
            </div>
            <div class="stat-card">
                <h3>Confirmed</h3>
                <div id="confirmed-orders" class="value">0</div>
            </div>
            <div class="stat-card">
                <h3>Completed</h3>
                <div id="completed-orders" class="value">0</div>
            </div>
        </div>

        <div id="orders-container"></div>

        <div class="call-log">
            <h2>📞 Live Call Activity</h2>
            <div id="call-log"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script>
        let allOrders = [];
        let stompClient = null;

        // Connect to WebSocket for real-time updates
        function connectWebSocket() {
            const socket = new SockJS('/ws-dashboard');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, onConnected, onError);
        }

        function onConnected() {
            document.getElementById('ws-status').className = 'status-badge status-connected';
            document.getElementById('ws-status').textContent = 'Connected';

            stompClient.subscribe('/topic/orders', (message) => {
                const data = JSON.parse(message.body);
                if (data.type === 'ORDER_UPDATE') {
                    refreshOrders();
                }
            });

            stompClient.subscribe('/topic/calls', (message) => {
                const data = JSON.parse(message.body);
                addCallEntry(data.data);
            });

            // Initial load
            refreshOrders();
        }

        function onError(error) {
            document.getElementById('ws-status').className = 'status-badge status-disconnected';
            document.getElementById('ws-status').textContent = 'Disconnected - Retrying...';
            setTimeout(connectWebSocket, 3000);
        }

        function refreshOrders() {
            fetch('/api/orders')
                .then(res => res.json())
                .then(orders => {
                    allOrders = orders;
                    renderOrders(orders);
                    updateStats(orders);
                })
                .catch(err => console.error('Failed to load orders:', err));
        }

        function renderOrders(orders) {
            const container = document.getElementById('orders-container');
            if (!orders || orders.length === 0) {
                container.innerHTML = '<div class="no-orders">No orders yet. Waiting for customer calls...</div>';
                return;
            }

            container.innerHTML = '<div class="orders-grid">' + orders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-id">Order #${order.id.slice(-6)}</span>
                        <span class="order-status status-${order.status}">${order.status}</span>
                    </div>
                    <div class="order-body">
                        <div class="customer-info">
                            <p><strong>Customer:</strong> ${order.customerPhoneNumber || 'Unknown'}</p>
                            <p><strong>Pickup:</strong> ${order.pickupTime || 'Not set'}</p>
                            <p><strong>Placed:</strong> ${new Date(order.createdAt).toLocaleString()}</p>
                            <p><strong>Total Amount:</strong> ₹${order.totalPrice ? order.totalPrice.toFixed(2) : '0.00'}</p>
                        </div>
                        <ul class="items-list">
                            ${order.items.map(item => `
                                <li>
                                    <span class="item-name">${item.name}</span>
                                    <span class="item-qty">${item.quantity} ${item.unit}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                    <div class="order-footer">
                        <span>Items: ${order.items.length} (₹${order.totalPrice ? order.totalPrice.toFixed(2) : '0.00'})</span>
                        <span>Updated: ${new Date(order.updatedAt).toLocaleTimeString()}</span>
                    </div>
                </div>
            `).join('') + '</div>';
        }

        function updateStats(orders) {
            document.getElementById('total-orders').textContent = orders.length;
            document.getElementById('preparing-orders').textContent = orders.filter(o => o.status === 'PREPARING').length;
            document.getElementById('confirmed-orders').textContent = orders.filter(o => o.status === 'CONFIRMED').length;
            document.getElementById('completed-orders').textContent = orders.filter(o => o.status === 'COMPLETED').length;
        }

        function addCallEntry(message) {
            const log = document.getElementById('call-log');
            const entry = document.createElement('div');
            entry.className = 'call-entry';
            entry.innerHTML = `<span class="call-time">${new Date().toLocaleTimeString()}</span> ${message}`;
            log.insertBefore(entry, log.firstChild);
        }

        connectWebSocket();
    </script>
</body>
</html>
