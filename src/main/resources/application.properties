# Server configuration
server.port=${SERVER_PORT:8080}

# MongoDB configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/kirana_store}

# Logging
logging.level.root=INFO
logging.level.com.kirana.assistant=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Application config
# Enables sample data seeding on first boot (inventory + demo customer/WhatsApp list)
SEED_DATA=${SEED_DATA:true}
# Public base URL (ngrok URL) - used for Twilio webhooks and media streams
# e.g. https://abc123.ngrok.io
PUBLIC_BASE_URL=${PUBLIC_BASE_URL:}
