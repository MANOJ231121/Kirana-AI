# Server configuration
server.port=${SERVER_PORT:8080}

# MongoDB configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/kirana_store}

# AI & Voice API Keys (Read from .env or environment)
# Individual service @Value annotations provide the fallback defaults.
RIME_API_KEY=${RIME_API_KEY:}
RIME_SPEAKER=${RIME_SPEAKER:nadi}
GROQ_API_KEY=${GROQ_API_KEY:}

# Logging
logging.level.root=INFO
logging.level.com.kirana.assistant=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
